name: "HRP-React-2026"version: "3.8"
services:
  nginx:
    container_name: nginx-1
    image: nginx:1.27-alpine
    ports:
      - "${WEBUI_PORT}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    environment: 
      - TZ=Asia/Kolkata      
    depends_on:
      - webui
      - adapter
      - websocket
    networks:
      - sandbox-nw
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "100m" 

  webui:
    container_name: webui-1
    image: nexus.headquarters.healthedge.com:8124/payor-ui-react:${UI_VERSION}
    environment: 
      - TZ=Asia/Kolkata
    networks:
      - sandbox-nw
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "100m"
  
  adapter:
    container_name: adapter-1
    image: nexus.headquarters.healthedge.com:8124/payor-rest-adaptor:${ADAPTOR_VERSION}
    volumes:
      - ./managerConfig.json:/app/config/managerConfig.json
    environment:
      - TZ=Asia/Kolkata
      - DEFAULT_PAYER_SERVER_URL=${PAYER_SERVER}
      - MANAGER_CONFIG_PATH=/app/config
      - ELASTICSEARCH_ENABLED=DISABLED
      - REDIS_ENABLED=DISABLED
      - LOGGING_LEVEL_ROOT=INFO
    networks:
      - sandbox-nw
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "2g"
  
  websocket:
    container_name: websocket-1
    image: nexus.headquarters.healthedge.com:8124/payor-adaptor-websocket:${WEBSOCKET_VERSION}
    environment:
      - TZ=Asia/Kolkata
      - ADAPTOR_HOST_URL=http://adapter-1:3030
    networks:
      - sandbox-nw
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "2g"

networks:
  sandbox-nw:
    name: sandbox-nw