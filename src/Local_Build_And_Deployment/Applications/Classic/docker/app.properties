### HealthEdge Classic — Local Development Properties
### Container: classic-tc  |  Port: 7002

### The default URL of the Classic server
DEFAULT_URL=http://localhost:7002

### Java heap size
JAVA_INITIAL_HEAP_SIZE=2096m
JAVA_MAX_HEAP_SIZE=6G

JAVA_GC_PARAMETERS=-XX:+UseParallelOldGC

### WebLogic domain settings
WL_DOMAIN=classic_dev
LW_TRACE_DIR=/home/weblogic/healthedge-logs
WEB_SERVICE_TRACE_DIR=/home/weblogic/healthedge-logs

### OLTP Database connection
OLTP_PLATFORM=Oracle
OLTP_HOST=classic-db
OLTP_DB=DB19C
OLTP_PORT=1521
OLTP_USER=CLASSIC_OLTP
OLTP_PASSWORD=hedge
OLTP_DATA_TABLESPACE=data1
OLTP_INDEX_TABLESPACE=indx1
oltpDS.maxPoolSize=20
oltpDS.minPoolSize=1

### Default user credentials
DEFAULT_USER=hcc_admin
DEFAULT_PASSWORD=denovis10x
DEFAULT_MBEAN_USER=weblogic
DEFAULT_MBEAN_PASSWORD=denovis10x

### Encryption
ENCRYPTION_KEYSTORE_NAME=encrypt-keystore.jks
ENCRYPTION_KEYSTORE_DIR=
ENCRYPTION_KEYSTORE_PASSWORD=hedge123
ENCRYPTION_KEY_ALIAS=encrypt-key
ENCRYPTION_KEY_PASSWORD=hedge123
